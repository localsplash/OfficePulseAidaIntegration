name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: db-users-test
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DB_USERS_MYSQL_URL: mysql://root:db-users-test@127.0.0.1:3306/aida_db_users_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - run: npm run typecheck
      - run: npm test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t aida-integration:ci \
            --build-arg BUILD_REVISION="$(git rev-parse HEAD)" \
            --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            --build-arg BUILD_DIRTY=false .
      - name: Container runs as non-root
        run: |
          test "$(docker run --rm aida-integration:ci whoami)" = "node"
