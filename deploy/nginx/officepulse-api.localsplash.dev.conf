server {
    listen 172.83.90.46:80;
    server_name officepulse-api.localsplash.dev;
    location / { return 301 https://officepulse-api.localsplash.dev$request_uri; }
}

server {
    listen 172.83.90.46:443 ssl http2;
    server_name officepulse-api.localsplash.dev;
    ssl_certificate /etc/letsencrypt/live/officepulse-api.localsplash.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officepulse-api.localsplash.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 64k;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;

    location = /healthz { proxy_pass http://127.0.0.1:8086; }
    location = /readyz { proxy_pass http://127.0.0.1:8086; }
    location ~ "^/v1/agent/calls/[0-9a-fA-F-]{36}/bootstrap$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8086;
    }
    location = /v1/integrations/livekit/webhooks {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8086;
    }
    location ^~ /v1/handset/ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8086;
    }
    location ^~ /v1/admin/ {
        allow 172.83.90.41;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8085;
    }
    location = / { proxy_pass http://127.0.0.1:8086; }
    location = /docs { proxy_pass http://127.0.0.1:8086; }
    location ^~ /docs/ { proxy_pass http://127.0.0.1:8086; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8086; }
    location / { return 404; }
}
