; Aida dialplan include — versioned static contexts for OfficePulse.
; Install as /etc/asterisk/extensions_aida.conf and add to extensions.conf:
;   #include extensions_aida.conf
;
; Inbound DID rows live in Asterisk Realtime (written by the
; OfficePulseAidaIntegration provisioning API) and always end with
; Goto(aida-post-bootstrap,s,1). Realtime rows NEVER dial a destination
; directly; all routing outcomes converge here.
;
; AIDA_INCLUDE_VERSION: 1

[aida-globals](!)
; Operator-owned defaults used when AidaControl could not supply a
; fallback destination (e.g. it was unreachable before returning one).
; Set per deployment in extensions.conf [globals]:
;   AIDA_DEFAULT_FALLBACK_CONTEXT=office-main
;   AIDA_DEFAULT_FALLBACK_EXTEN=100

; ---------------------------------------------------------------------------
; Recording disclosure — ALWAYS before FastAGI/LiveKit (POC issue 5).
; The Gosub to officepulse-recording engages the existing OfficePulse
; recording path when that context is present on this system.
[aida-disclosure]
exten => s,1,Answer()
 same => n,GosubIf($[${DIALPLAN_EXISTS(officepulse-recording,s,1)}]?officepulse-recording,s,1)
 same => n,Playback(aida/aida-recording-disclosure)
 same => n,Return()

; ---------------------------------------------------------------------------
; Post-bootstrap routing. The FastAGI /bootstrap handler set:
;   AIDA_DISPOSITION            SCREEN | FALLBACK | REJECT
;   AIDA_CALL_SESSION_ID, AIDA_ROOM_NAME, AIDA_SIP_DESTINATION,
;   AIDA_ROUTE_TOKEN            (SCREEN only)
;   AIDA_FALLBACK_CONTEXT/EXTENSION (when resolvable)
; If the AGI itself failed (service down), AIDA_DISPOSITION is empty and
; the empty-match below routes to fallback — Aida being down never
; strands a caller.
[aida-post-bootstrap]
exten => s,1,NoOp(aida disposition=${AIDA_DISPOSITION})
 same => n,GotoIf($["${AIDA_DISPOSITION}"="SCREEN"]?screen)
 same => n,GotoIf($["${AIDA_DISPOSITION}"="REJECT"]?reject)
 same => n,Goto(fallback)
 ; --- SCREEN: hand the caller to the ARI app; it originates the LiveKit
 ; leg through the existing SIP trunk with X-Aida-* headers injected and
 ; bridges the media. Media never traverses the integration service.
 same => n(screen),Stasis(aida,screen,${AIDA_CALL_SESSION_ID})
 same => n,GotoIf($["${STASISSTATUS}"="SUCCESS"]?done)
 ; Stasis unavailable (ARI down) -> local fallback, same as Aida failure.
 same => n,Goto(fallback)
 ; --- FALLBACK: disclosure already played; play the failure prompt and
 ; dial the configured destination directly. The answering extension
 ; hears the incident prompt (U-sub) after answering, before bridging.
 same => n(fallback),Playback(aida/aida-circuits-busy)
 same => n,Set(AIDA_FB_CTX=${IF($["${AIDA_FALLBACK_CONTEXT}"!=""]?${AIDA_FALLBACK_CONTEXT}:${AIDA_DEFAULT_FALLBACK_CONTEXT})})
 same => n,Set(AIDA_FB_EXT=${IF($["${AIDA_FALLBACK_EXTENSION}"!=""]?${AIDA_FALLBACK_EXTENSION}:${AIDA_DEFAULT_FALLBACK_EXTEN})})
 same => n,GotoIf($["${AIDA_FB_EXT}"=""]?congestion)
 same => n,Dial(Local/${AIDA_FB_EXT}@${AIDA_FB_CTX},30,U(aida-agent-notice^s^1))
 same => n,Hangup()
 same => n(congestion),Congestion(5)
 same => n,Hangup()
 same => n(reject),Hangup(21)
 same => n(done),Hangup()

; Extension-facing incident prompt on the fallback path (POC issue 5).
[aida-agent-notice]
exten => s,1,Playback(aida/aida-agent-incident)
 same => n,Return()

; Endpoints administratively disabled by the provisioning API land here.
[aida-disabled]
exten => _X.,1,Congestion(3)
 same => n,Hangup()
