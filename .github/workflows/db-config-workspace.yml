name: Validate scoped database settings
on:
  push:
    branches: [chore/standard-db-settings-20260929]
    paths: [.github/workflows/db-config-workspace.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: db-users-test
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed changes with before and after integrity checks
        env:
          EDITS: 
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          manifest = json.loads(gzip.decompress(base64.b64decode(os.environ['EDITS'])))
          for name, before_hash, after_hash, edits in manifest:
              path = Path(name)
              old = path.read_text() if path.exists() else ''
              if before_hash is None:
                  assert not path.exists(), name
              else:
                  assert hashlib.sha256(old.encode()).hexdigest() == before_hash, name
              lines = old.splitlines(True)
              for start, end, replacement in reversed(edits):
                  lines[start:end] = [replacement]
              new = ''.join(lines)
              assert hashlib.sha256(new.encode()).hexdigest() == after_hash, name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(new)
              print('Applied:', name)
          PY
          rm .github/workflows/db-config-workspace.yml
          git diff --check
      - name: Install and validate including real MySQL privileges
        env:
          TEST_DB_USERS_MYSQL_URL: mysql://root:db-users-test@127.0.0.1:3306/aida_db_users_test
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
          npm run typecheck
          npm test
      - name: Publish validated code to work branch only
        run: |
          git checkout HEAD -- .github/workflows/db-config-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: consume scoped DB settings and provision dedicated runtime accounts'
          git push origin HEAD:${{ github.ref_name }}
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          echo "VALIDATED_TREE=$(git rev-parse HEAD^{tree})"
