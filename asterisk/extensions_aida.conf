; Aida dialplan include — versioned static contexts for OfficePulse.
; Install as /etc/asterisk/extensions_aida.conf and add to extensions.conf:
;   #include extensions_aida.conf
;
; Native managed DIDs invoke aida-managed-did-v1 directly. Historical voice
; bootstrap contexts remain below for separately owned existing installations.
; AIDA_INCLUDE_VERSION: 2

[aida-globals](!)
; Operator-owned emergency defaults, used only when a DID has no local
; destination projection of its own (see deploy/sql/runtime-schema.sql).
; Set per deployment in extensions.conf [globals]:
;   AIDA_DEFAULT_FALLBACK_CONTEXT=office-main
;   AIDA_DEFAULT_FALLBACK_EXTEN=100

; ---------------------------------------------------------------------------
; Recording disclosure — ALWAYS before FastAGI/LiveKit (POC issue 5).
; The Gosub to officepulse-recording engages the existing OfficePulse
; recording path when that context is present on this system.
[aida-disclosure]
exten => s,1,Answer()
 same => n,GosubIf($[${DIALPLAN_EXISTS(officepulse-recording,s,1)}]?officepulse-recording,s,1)
 same => n,Playback(aida/aida-recording-disclosure)
 same => n,Return()

; ---------------------------------------------------------------------------
; Post-bootstrap routing. The FastAGI /bootstrap handler set:
;   AIDA_DISPOSITION            SCREEN | FALLBACK | REJECT
;   AIDA_CALL_SESSION_ID, AIDA_ROOM_NAME, AIDA_SIP_DESTINATION (SCREEN only)
;   AIDA_FALLBACK_CONTEXT/EXTENSION (when resolvable)
; If the AGI itself failed (service down), AIDA_DISPOSITION is empty and
; the empty-match below routes to fallback — Aida being down never
; strands a caller.
[aida-post-bootstrap]
exten => s,1,NoOp(aida disposition=${AIDA_DISPOSITION})
 same => n,GotoIf($["${AIDA_DISPOSITION}"="SCREEN"]?screen)
 same => n,GotoIf($["${AIDA_DISPOSITION}"="REJECT"]?reject)
 same => n,Goto(fallback)
 ; --- SCREEN: hand the caller to the ARI app; it originates the LiveKit
 ; leg through the existing SIP trunk with X-Aida-* headers injected and
 ; bridges the media. Media never traverses the integration service.
 same => n(screen),Stasis(aida,screen,${AIDA_CALL_SESSION_ID})
 same => n,GotoIf($["${STASISSTATUS}"="SUCCESS"]?done)
 ; Stasis unavailable (ARI down) -> local fallback, same as Aida failure.
 same => n,Goto(fallback)
 ; --- FALLBACK: disclosure already played; play the failure prompt and
 ; dial the configured destination directly. The answering extension
 ; hears the incident prompt (U-sub) after answering, before bridging.
 same => n(fallback),Playback(aida/aida-circuits-busy)
 same => n,Set(AIDA_FB_CTX=${IF($["${AIDA_FALLBACK_CONTEXT}"!=""]?${AIDA_FALLBACK_CONTEXT}:${AIDA_DEFAULT_FALLBACK_CONTEXT})})
 same => n,Set(AIDA_FB_EXT=${IF($["${AIDA_FALLBACK_EXTENSION}"!=""]?${AIDA_FALLBACK_EXTENSION}:${AIDA_DEFAULT_FALLBACK_EXTEN})})
 same => n,GotoIf($["${AIDA_FB_EXT}"=""]?congestion)
 same => n,Dial(Local/${AIDA_FB_EXT}@${AIDA_FB_CTX},30,U(aida-agent-notice^s^1))
 same => n,Hangup()
 same => n(congestion),Congestion(5)
 same => n,Hangup()
 same => n(reject),Hangup(21)
 same => n(done),Hangup()

; Extension-facing incident prompt on the fallback path (POC issue 5).
[aida-agent-notice]
exten => s,1,Playback(aida/aida-agent-incident)
 same => n,Return()

; Endpoints administratively disabled by the provisioning API land here.
[aida-disabled]
exten => _X.,1,Congestion(3)
 same => n,Hangup()

; Managed native DID routing. Version 1 is a stable Realtime invocation ABI.
; ARG1=owned native queue, ARG2=rings (1..12), ARG3=LiveKit E.164,
; ARG4=time range or *, ARG5=normalized weekdays or *, ARG6=IANA timezone.
; No AGI/HTTP/Node dependency. The compiler emits only these six validated args.
[aida-managed-did-v1]
exten => s,1,NoOp(OfficePulse managed DID v1)
 same => n,GotoIf($[${ARGC} != 6]?invalid)
 same => n,GotoIf($[${REGEX("^[a-zA-Z0-9_.-]{1,80}$" ${ARG1})} != 1]?invalid)
 same => n,GotoIf($[${REGEX("^([1-9]|1[0-2])$" ${ARG2})} != 1]?invalid)
 same => n,GotoIf($[${REGEX("^[+][1-9][0-9]{6,14}$" ${ARG3})} != 1]?invalid)
 same => n,GotoIf($["${ARG4}" = "*" & "${ARG5}" = "*" & "${ARG6}" = "UTC"]?validated)
 same => n,GotoIf($[${REGEX("^([01][0-9]|2[0-3]):[0-5][0-9]-([01][0-9]|2[0-3]):[0-5][0-9]$" ${ARG4})} != 1]?invalid)
 same => n,GotoIf($[${REGEX("^(sun|mon|tue|wed|thu|fri|sat)(&(sun|mon|tue|wed|thu|fri|sat))*$" ${ARG5})} != 1]?invalid)
 same => n,GotoIf($[${REGEX("^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$" ${ARG6})} != 1]?invalid)
 same => n,GotoIf($[${STAT(e,/usr/share/zoneinfo/${ARG6})} != 1]?invalid)
 ; One operator-owned hook adapts the existing tenant-specific recording path.
 ; Set OFFICEPULSE_RECORDING_STARTED in the hook and static ingress wrappers.
 ; Existing MixMonitor/CDR markers also prevent a second recording.
 same => n(validated),GotoIf($["${OFFICEPULSE_RECORDING_STARTED}" = "1" | "${MIXMONITOR_FILENAME}" != "" | "${CDR(userfield)}" != ""]?schedule)
 same => n,GosubIf($[${DIALPLAN_EXISTS(officepulse-recording,s,1)}]?officepulse-recording,s,1(inbound))
 same => n(schedule),GotoIf($["${ARG4}" = "*"]?queue)
 same => n,GotoIfTime(${ARG4},${ARG5},*,*,${ARG6}?queue:livekit)
 ; Five seconds per ring is the POC approximation. No 'c' continuation on answer.
 same => n(queue),Ringing()
 same => n,Set(QUEUESTATUS=)
 same => n,Queue(${ARG1},r,,,$[${ARG2} * 5])
 ; Defensive guard for an answered queue that unexpectedly returns to dialplan.
 same => n,GotoIf($["${QUEUESTATUS}" = "CONTINUE"]?done)
 ; Timeout, full/unavailable/empty or absent queue falls through exactly once.
 same => n(livekit),Dial(PJSIP/${ARG3}@livekit,60)
 ; Missing/unavailable LiveKit ends the call. No retry or dialplan loop.
 same => n(done),Hangup()
 same => n(invalid),Hangup(21)
